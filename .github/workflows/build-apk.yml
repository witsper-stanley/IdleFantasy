name: Build modded APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-build3
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Use the fork's fixed signing key (so new builds install over old ones)
        run: mkdir -p ~/.android && cp .github/signing/debug.keystore ~/.android/debug.keystore

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Print signing certificate (verification only)
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$SIGNER" verify --print-certs "$APK"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME ANDROID_SDK_HOME=$ANDROID_SDK_HOME HOME=$HOME"
          ls -la ~/.android || true
