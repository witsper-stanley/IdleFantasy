name: Build modded APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Release build = no debug/developer tools. Signed with the fork's fixed key
      # (same certificate as the earlier debug builds) so it installs over them.
      - name: Install the fork's signing key
        run: mkdir -p ~/.android && cp .github/signing/release.jks ~/.android/defide-release.jks

      - name: Assemble release APK
        env:
          DEFIDE_STORE_PASSWORD: android
          DEFIDE_KEY_PASSWORD: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Check the APK is signed with the fork's key
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$SIGNER" verify --print-certs "$APK" | tee certs.txt
          grep -qi "b9a188681ed39f70ff45143f769f983aa3dbd223c01eb38766973be668fcba76" certs.txt
          cp "$APK" IdleFantasy-mod.apk

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest IdleFantasy-mod.apk \
            --title "Idle Fantasy mod (build ${{ github.run_number }})" \
            --notes "Release build (no debug tools). Timers at 1/10, queue size 10. Built from ${{ github.sha }}."
