name: Build modded APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Use the fork's fixed signing key (so new builds install over old ones)
        run: mkdir -p ~/.android && cp .github/signing/debug.keystore ~/.android/debug.keystore

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK" IdleFantasy-mod.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest IdleFantasy-mod.apk \
            --title "Idle Fantasy mod (build ${{ github.run_number }})" \
            --notes "Timers at 1/10, queue size 10. Built from ${{ github.sha }}."
