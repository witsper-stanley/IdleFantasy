name: Build modded APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-build3
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Use the fork's fixed signing key (so new builds install over old ones)
        run: mkdir -p ~/.android && cp .github/signing/debug.keystore ~/.android/debug.keystore

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Find every keystore and the one that signed the APK
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$SIGNER" verify --print-certs "$APK" | grep SHA-256
          sudo find / \( -name "*.keystore" -o -name "*.jks" \) -not -path "/proc/*" 2>/dev/null | tee ks.txt
          mkdir -p found
          n=0
          while read -r f; do
            d=$(keytool -list -v -keystore "$f" -storepass android 2>/dev/null | grep -m1 "SHA256:" || true)
            echo "$f -> $d"
            n=$((n+1)); sudo cp "$f" "found/$n-$(basename "$f")"; echo "$n $f $d" >> found/index.txt
          done < ks.txt
          sudo chown -R "$USER" found
          git config user.name witsper-stanley; git config user.email witsper-stanley@users.noreply.github.com
          git add -f found && git commit -q -m "Temp: keystores found on runner" && git push -q origin HEAD:verify-build3
